<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<title>자막 영상 재생기</title>
<style>
/* 레이아웃: 접은 화면 = 영상 위·목록 아래 / 펼친 화면 = 영상 왼쪽·목록 오른쪽 */
:root{--bg:#0f1115;--fg:#e8eaf0;--sub:#8a90a0;--line:#262a33;--card:#181b22;--acc:#5aa9ff;--warn:#ffb020;--hl:#ff9a3c;--cc:#ffffff;color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f4f5f8;--fg:#14161b;--sub:#5d6370;--line:#dde0e6;--card:#fff;--acc:#1f6fd1;--warn:#b86e00;color-scheme:light}}
:root[data-theme="light"]{--bg:#f4f5f8;--fg:#14161b;--sub:#5d6370;--line:#dde0e6;--card:#fff;--acc:#1f6fd1;--warn:#b86e00;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:12px/1.4 system-ui,-apple-system,"Noto Sans KR",sans-serif}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer;min-width:36px}
button:active,.pick:active{opacity:.6}
button.tog{background:var(--acc);color:#fff;border-color:var(--acc)}
button:focus-visible,.pick:focus-within{outline:2px solid var(--acc);outline-offset:1px}
#app{display:flex;flex-direction:column;height:100%}
#top{display:flex;gap:4px;flex-wrap:wrap;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}
.pick{position:relative;overflow:hidden;display:inline-block;background:var(--acc);color:#fff;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer}
.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px}
.seg{display:inline-flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:8px 0 0 8px;margin-left:0}
.seg button:last-child{border-radius:0 8px 8px 0}
#fname{flex:1 1 120px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub)}
#main{flex:1;min-height:0;display:flex;flex-direction:column}
#left{display:flex;flex-direction:column;min-width:0}
@media(min-width:700px){#main{flex-direction:row}#left{flex:1.7;border-right:1px solid var(--line)}#side{flex:1}}
#stage{position:relative;background:#000}
#stage video{width:100%;max-height:52vh;display:block;background:#000}
@media(min-width:700px){#stage video{max-height:calc(100vh - 200px)}}
#stage:fullscreen{display:flex;align-items:center}
#stage:fullscreen video{max-height:100vh;height:100%}
#cap{position:absolute;left:3%;right:3%;bottom:5%;text-align:center;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:3px}
#cap span{background:rgba(0,0,0,.72);color:var(--cc);padding:1px 8px;border-radius:4px;font-size:var(--cs,18px);line-height:1.45;white-space:pre-line}
#cap span.k2{font-size:calc(var(--cs,18px)*.85);color:#fff;opacity:.92}
#nov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#888;text-align:center;padding:20px}
#mute{position:absolute;left:8px;right:8px;top:8px;background:rgba(0,0,0,.82);color:#ffd27a;border:1px solid #ffb020;border-radius:8px;padding:6px 8px;font-size:12px;display:flex;gap:6px;align-items:flex-start}
#mute .g{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
#mute button{background:transparent;border-color:#ffb020;color:#ffd27a;padding:2px 6px}
#conv{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(0,0,0,.85);color:#fff;border:1px solid var(--acc);border-radius:8px;padding:6px 8px;font-size:12px}
#conv .pb{height:8px;background:#333;border-radius:4px;overflow:hidden;margin:4px 0}
#conv .pb i{display:block;height:100%;width:0;background:#5aa9ff;transition:width .3s}
#conv .r{display:flex;justify-content:space-between;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
#conv button{background:transparent;color:#fff;border-color:#888;padding:2px 8px}
#aBadge{color:#4cd964;font-weight:700}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#bar{padding:6px 8px 4px}
#tk{position:relative;height:16px;background:var(--line);border-radius:8px;overflow:hidden;cursor:pointer;touch-action:none}
#fill{height:100%;width:0;border-radius:8px}
#ticks{position:absolute;inset:0;pointer-events:none}
#ticks i{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.22)}
#abr{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.28);border-left:2px solid #fff;border-right:2px solid #fff;pointer-events:none}
#pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;text-shadow:0 0 3px #000}
#tx{display:flex;justify-content:space-between;font-size:12px;margin-top:4px;font-variant-numeric:tabular-nums}
#tx b{color:var(--acc)}
.row{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;padding:4px 8px}
#more{align-items:center}
#more .lb{color:var(--sub);margin-left:6px}
.chip{min-width:30px;padding:4px 7px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:3px;border:1px solid rgba(128,128,128,.6)}
#keys{color:var(--sub);text-align:center;padding:2px 8px 6px}
#gen{margin:4px 8px 6px;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--card);display:flex;flex-direction:column;gap:5px}
#gen .grow{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
#gen .gs{color:var(--sub);min-width:0;overflow-wrap:anywhere}
#gen input{flex:1 1 140px;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
#gen a{color:var(--acc)}
#gPb{position:relative;flex:1 1 140px;height:22px;background:var(--line);border-radius:8px;overflow:hidden}
#gPb i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--acc);transition:width .3s}
#gPt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;text-shadow:0 0 3px #000;white-space:nowrap;overflow:hidden;padding:0 6px}
#gKeyCh.arm,#cKeyCh.arm{background:#c0392b;color:#fff;border-color:#c0392b}
.pick.sm2{position:relative;overflow:hidden;display:inline-block;border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer;background:var(--card)}
.pick.sm2 input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
#stInfo{color:var(--sub)}
#side{display:flex;flex-direction:column;min-height:0;flex:1}
#sbar{display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line);align-items:center}
#q{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
#cnt{color:var(--sub);font-variant-numeric:tabular-nums}
#list{flex:1;min-height:0;overflow-y:auto}
.ln{display:flex;gap:8px;padding:5px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.ln .t{color:var(--sub);font-variant-numeric:tabular-nums;flex:0 0 auto;padding-top:1px}
.ln .x{white-space:pre-line;min-width:0;overflow-wrap:anywhere}
.ln .x small{display:block;color:var(--sub);font-size:11px}
.ln.on{background:var(--hl);color:#000;font-weight:700}
.ln.on .t,.ln.on .x small{color:#000}
.rc{display:flex;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}
.rc label{flex:1;min-width:0;cursor:pointer;position:relative}
.rc .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc .m{color:var(--sub);font-size:11px;font-variant-numeric:tabular-nums}
.rc .pb{height:4px;background:var(--line);border-radius:2px;margin-top:3px;overflow:hidden}
.rc .pb i{display:block;height:100%;background:var(--acc)}
.rc input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.rc .del.arm{background:#c0392b;color:#fff;border-color:#c0392b}
mark{background:#ffd400;color:#000;animation:fl .5s 6}
@keyframes fl{50%{background:transparent;color:inherit}}
.empty{padding:24px 12px;color:var(--sub);text-align:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:8px 14px;border-radius:20px;z-index:30;max-width:90vw;text-align:center}
@media (prefers-reduced-motion: reduce){mark{animation:none}}
</style>

</head><body>
<div id="app">
  <div id="top">
    <label class="pick">영상<input id="fv" type="file" accept="video/*,audio/*,.mkv,.avi"></label>
    <label class="pick">자막<input id="fs" type="file" multiple></label>
    <button id="bGen" title="자막 만들기: 영어 받아쓰기 + 한글 번역 (G)">생성</button>
    <span class="seg"><button id="mKo">한</button><button id="mEn">영</button><button id="mBo">둘</button></span>
    <span id="aBadge" hidden title="변환한 소리로 재생 중">🔊</span><span id="fname">영상과 자막 파일을 고르세요</span>
    <button id="bFs" title="전체화면">⛶</button>
  </div>
  <div id="main">
    <div id="left">
      <div id="stage">
        <video id="v" playsinline preload="metadata"></video><audio id="au" preload="auto"></audio>
        <div id="nov">「영상」 → 「자막」 순서로 고르세요<br>자막: srt · vtt · smi · ass (한영 통합 자막·2개 동시 가능)</div>
        <div id="mute" hidden><div style="flex:1"><span id="muteTx"></span><div class="g"><button id="muteFix">소리 살리기</button><button id="muteResume" hidden>이어서 변환</button><button id="muteSub">내장 자막 꺼내기</button><button id="muteX">닫기</button></div></div></div>
        <div id="conv" hidden><div class="r"><b id="cvT">소리 변환 준비 중…</b><button id="cvX">취소</button></div><div class="pb"><i id="cvB"></i></div><div class="r"><span id="cvL"></span><span id="cvR"></span></div></div>
        <div id="cap"></div>
      </div>
      <div id="bar">
        <div id="tk"><div id="fill"></div><div id="ticks"></div><div id="abr" hidden></div><div id="pct">0%</div></div>
        <div id="tx"><span>지난 <b id="te">0:00</b></span><span>남은 <b id="tr">0:00</b></span><span>전체 <b id="td">0:00</b></span></div>
      </div>
      <div id="gen" hidden>
        <div class="grow"><span id="gSrc" class="gs"></span></div>
        <div class="grow"><span class="gs">원어</span><span class="seg"><button id="gEn">영</button><button id="gJa">일</button></span><button id="gTr" title="받아쓴 뒤 한국어로 번역">번역</button><span class="gs">엔진</span><span class="seg"><button id="eGq">Groq</button><button id="eCl">Claude</button></span></div>
        <div class="grow" id="cKeyRow" hidden><input id="cKeyIn" type="password" placeholder="Claude API 키 (sk-ant-…) 붙여넣기" autocomplete="off"><button id="cKeySv">저장</button><a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">키 받기 ↗</a></div>
        <div class="grow" id="gKeyRow"><input id="gKey" type="password" placeholder="Groq 키 (gsk_…) 붙여넣기" autocomplete="off"><button id="gKeySv">저장</button><a href="https://console.groq.com/keys" target="_blank" rel="noopener">키 받기 ↗</a></div>
        <div class="grow"><button id="gGo" class="tog">시작</button><button id="gTrOnly" hidden>번역만</button><div id="gPb"><i></i><b id="gPt">대기</b></div></div>
        <div class="grow"><span class="gs">만든 자막은 자동 저장 · 파일로는 ⋯ → 「자막 저장」</span><button id="gKeyCh" hidden>Groq 키 지우기</button><button id="cKeyCh" hidden>Claude 키 지우기</button></div>
      </div>
      <div class="row">
        <button id="cP">▶</button><button id="cB">-5</button><button id="cF">+5</button>
        <button id="cPr">문‹</button><button id="cNx">문›</button><button id="cLp" title="현재 자막 반복">반</button><button id="cAB" title="구간 반복: A 누르고 B 누르기">A-B</button>
        <button id="cSm">속−</button><button id="cS" disabled>1.0x</button><button id="cSp">속+</button>
        <button id="cMore">⋯</button>
      </div>
      <div class="row" id="more" hidden>
        <button id="zSm">자−</button><button id="zS" disabled>18</button><button id="zSp">자+</button>
        <button id="oSm">싱−</button><button id="oS" disabled>0.0초</button><button id="oSp">싱+</button>
        <span class="lb">글색</span><span id="ccs"></span>
        <span class="lb">줄색</span><span id="hls"></span>
        <span class="lb">내장 자막</span><button id="sExt">꺼내기</button><button id="sSave">자막 저장</button><span class="lb">소리</span><button id="aConv">변환</button><button id="aSave" disabled>저장</button><label class="pick sm2">파일<input id="aPick" type="file" accept="audio/*,.m4a,.aac,.mp3"></label><button id="aoSm">소싱−</button><button id="aoS" disabled>0.0초</button><button id="aoSp">소싱+</button>
        <button id="cHide">자막 끄기</button><button id="cKey">key</button>
        <span class="lb" id="stInfo"></span><button id="stKeep">보관 고정</button>
      </div>
      <div id="keys" hidden>스페이스 재생/정지 · ←/→ 5초 · ,/. 이전/다음 자막 · R 자막 반복 · B 구간 A-B · 1/2/3 한/영/둘 · G 자막 생성 창 · F 전체화면 · 영상 두 번 탭 = 영상만 크게</div>
    </div>
    <div id="side">
      <div id="sbar"><span class="seg"><button id="tSub" class="tog">자막</button><button id="tRec">최근</button></span><input id="q" placeholder="🔍 검색 (초성 가능)"><span id="cnt"></span></div>
      <div id="list"></div>
    </div>
  </div>
</div>
<div id="toast" hidden></div>

<script type="module">
const $=s=>document.querySelector(s);
const ld=(k,d)=>{try{const x=localStorage.getItem(k);return x==null?d:JSON.parse(x)}catch(e){return d}};
const sv=(k,x)=>{try{localStorage.setItem(k,JSON.stringify(x))}catch(e){}};
const p2=n=>String(n).padStart(2,'0');
const fmt=s=>{if(!isFinite(s))return '0:00';s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+':'+p2(m)+':'+p2(x):m+':'+p2(x)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tT;function toast(m,ms=1800){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,ms)}
const v=$('#v');
let T={ko:[],en:[]},names={ko:'',en:''},base=[],ci=-1,off=0,loop=false,loopIdx=-1,A=null,B=null,hide=false;
let mode=ld('sp_mode','both'),speed=ld('sp_speed',1),cs=ld('sp_cs',18),cc=ld('sp_cc','#ffffff'),hlc=ld('sp_hl','#ff9a3c');
let vname='',vk='',tab='sub',recent=ld('sp_recent',[]);

// ---- 파일 ----
$('#fv').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;openVideo(f)};
function openVideo(f){
  if(v.src)URL.revokeObjectURL(v.src);
  T={ko:[],en:[]};names={ko:'',en:''};off=0;setOff(0);clearAB();if(loop)setLoop();
  v.src=URL.createObjectURL(f);vname=f.name;vk=f.name+'|'+f.size;window.__setFile&&window.__setFile(f);window.__onVideoOpen&&window.__onVideoOpen(vk);$('#nov').hidden=true;$('#mute').hidden=true;audioChecked=false;
  rebuild();showName();setTab('sub');
  const r=recent.find(x=>x.k===vk);
  v.onloadedmetadata=()=>{v.playbackRate=speed;
    if(r&&r.pos>5&&r.pos<v.duration-5){v.currentTime=r.pos;toast('이어 보기 '+fmt(r.pos)+(r.subs&&r.subs.length?' · 자막 다시 고르세요':''),3000)}
    else toast('자막을 고르세요 (이전 자막은 지웠어요)',2500);
    upsertRecent({dur:v.duration});drawTicks()};
  v.play().catch(()=>{})}
$('#fs').onchange=async e=>{const fs=[...e.target.files];e.target.value='';if(!fs.length)return;
  if(!v.src)toast('영상을 먼저 고르면 더 좋아요');
  const items=[];for(const f of fs.slice(0,2))items.push({name:f.name,text:await readText(f)});loadSubs(items)};
function loadSubs(items,quiet){let msg=[];
  for(const it of items){
    const t=it.text.replace(/^\uFEFF/,'');
    const raw=/\[Script Info\]|^Dialogue:/mi.test(t)?parseAss(t):/<sync/i.test(t)?parseSmi(t):parseSrt(t);
    const sp=splitLang(raw);
    if(!sp.ko.length&&!sp.en.length){msg.push(it.name+': 읽지 못함');continue}
    if(sp.ko.length){T.ko=sp.ko;names.ko=it.name}
    if(sp.en.length){T.en=sp.en;names.en=it.name}
    msg.push((sp.ko.length&&sp.en.length?'한영 통합 ':sp.ko.length?'한글 ':'영어 ')+(sp.ko.length||sp.en.length)+'줄')}
  if(T.ko.length&&T.en.length&&mode!=='both'&&!ld('sp_mode_set',0))mode='both';
  ci=-2;rebuild();showName();setTab('sub');upsertRecent({subs:[names.en,names.ko].filter(Boolean)});if(!quiet)toast(msg.join(' · '),2500);return msg}
window.__loadSubs=loadSubs;
function showName(){$('#fname').textContent=[vname,names.en,names.ko!==names.en?names.ko:''].filter(Boolean).join(' + ')||'영상과 자막 파일을 고르세요'}
async function readText(f){const b=await f.arrayBuffer();try{return new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){try{return new TextDecoder('euc-kr').decode(b)}catch(e2){return new TextDecoder().decode(b)}}}

// ---- 자막 읽기 ----
function toSec(s){s=s.trim().replace(',','.');const p=s.split(':').map(Number);return p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1]}
const strip=x=>x.replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'').replace(/\{\\[^}]*\}/g,'').replace(/&nbsp;/gi,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/[ \t]+\n/g,'\n').replace(/\n{2,}/g,'\n').trim();
function parseSrt(t){const out=[];for(const b of t.replace(/\r/g,'').split(/\n\s*\n/)){const ls=b.split('\n');const i=ls.findIndex(l=>l.includes('-->'));if(i<0)continue;
  const [a,c]=ls[i].split('-->');const x=strip(ls.slice(i+1).join('\n'));if(x)out.push({s:toSec(a),e:toSec(c.trim().split(/\s+/)[0]),x})}
  return out.sort((a,b)=>a.s-b.s)}
function parseAss(t){const out=[];for(const l of t.split(/\r?\n/)){if(!/^Dialogue:/i.test(l))continue;const p=l.slice(9).split(',');if(p.length<10)continue;
  const x=p.slice(9).join(',').replace(/\\N/gi,'\n').replace(/\{[^}]*\}/g,'').trim();if(x)out.push({s:toSec(p[1]),e:toSec(p[2]),x})}return out.sort((a,b)=>a.s-b.s)}
function parseSmi(t){const re=/<sync\s+start\s*=\s*["']?(\d+)[^>]*>([\s\S]*?)(?=<sync|<\/body|$)/gi;let m;const g={};
  while((m=re.exec(t))){const s=+m[1]/1000,body=m[2];const pr=/<p\b[^>]*?class\s*=\s*["']?([\w-]+)[^>]*>([\s\S]*?)(?=<p\b|$)/gi;let pm,any=false;
    while((pm=pr.exec(body))){any=true;(g[pm[1]]=g[pm[1]]||[]).push({s,x:strip(pm[2])})}
    if(!any)(g['']=g['']||[]).push({s,x:strip(body)})}
  const out=[];for(const cls in g){const a=g[cls];a.forEach((r,i)=>{if(!r.x)return;let n=i+1;while(n<a.length&&a[n].s===r.s)n++;out.push({s:r.s,e:n<a.length?a[n].s:r.s+5,x:r.x,c:cls})})}
  return out.sort((a,b)=>a.s-b.s)}
const HAN=/[가-힣ㄱ-ㆎ]/,LET=/\p{L}/u;

async function ffReady(){if(!ff){ff=new FFmpeg();const base=new URL('./ffmpeg/core/',location.href).href;await ff.load({coreURL:base+'ffmpeg-core.js',wasmURL:base+'ffmpeg-core.wasm'})}

    const d=/Duration: (\d+):(\d+):([\d.]+)/.exec(l);if(d&&!dur)dur=+d[1]*3600+ +d[2]*60+ +d[3]}

// ---- 메인: 자막 꺼내기 → (그림 자막 OCR) → 소리 조각 변환 ----
async function convert(want={audio:true,subs:true}){if(!curFile)return toast('먼저 「영상」을 고르세요');if(ffBusy)return toast('이미 변환 중이에요');

    cvShow('변환 엔진 받는 중… (처음 1번 31MB)',0,'','');const inp=await ffReady();
    cvShow('파일 안 트랙 살펴보는 중…',1);const {st,dur:d0}=await probe(inp);const dur=d0||v.duration||0;

    const subT=subs.filter(x=>TXT.test(x.codec)),subP=subs.filter(x=>/pgs/.test(x.codec)),subO=subs.filter(x=>!TXT.test(x.codec)&&!/pgs/.test(x.codec));

      if(!pick.length)notes.push(subO.length?'내장 자막 형식('+subO[0].codec+')은 지원 안 함':'내장 자막 없음');
      else{
        const args=['-hide_banner','-i',inp];for(const p of pick)args.push('-map','0:'+p.i,'-c:s',isP?'copy':'srt','-f',isP?'sup':'srt','/s'+p.i);
        const lab=isP?'그림 자막 꺼내는 중':'자막 꺼내는 중';cvShow(lab+'… 0%',0);mediaTitle(lab);
        const onL=({message})=>{const m=/time=(\d+):(\d+):([\d.]+)/.exec(message);if(m&&dur){const p=Math.min(1,(+m[1]*3600+ +m[2]*60+ +m[3])/dur);gp=p*(isP?0.05:0.1);gAt=Date.now();cvShow(lab+'… '+Math.round(p*100)+'%',p*100)}};
        ff.on('log',onL);const rc=await ff.exec(args);ff.off('log',onL);if(cancelReq)throw new Error('cancel');
        const items=[];
        for(const p of pick){let data=null;try{data=await ff.readFile('/s'+p.i);await ff.deleteFile('/s'+p.i)}catch(e){}
          if(!data||!data.length)continue;
          if(isP){const tx=await ocrSup(data,p,key);if(tx)items.push({name:'내장 자막 OCR'+(p.lang?' ('+p.lang+')':''),text:tx})}
          else{const tx=new TextDecoder().decode(data);if(tx.trim())items.push({name:'내장 자막'+(p.lang?' ('+p.lang+')':''),text:tx})}}
        if(rc!==0&&!items.length)notes.push('자막 꺼내기 실패');
        if(items.length){await idbPut(key+'|subs',JSON.stringify(items));if(key===vk)done.push('자막 '+loadSubs(items,true).join(' · '))}
        if((isP?subP:subT).length>pick.length)notes.push('다른 내장 자막 '+((isP?subP:subT).length-pick.length)+'개는 건너뜀')}}
    if(cancelReq)throw new Error('cancel');
    // 2) 소리: 10분 조각으로 변환 → 조각마다 저장(끊겨도 이어서) → 합치기
    if(want.audio){
      if(!hasA)notes.push('소리 트랙 없음');
      else{
        const LEN=+(new URLSearchParams(location.search).get('chunk'))||600,n=Math.max(1,Math.ceil(dur/LEN));let job=await idbGet(key+'|aj');
        if(!job||job.n!==n||job.len!==LEN)job={n,len:LEN,done:Array(n).fill(false),fr:Array(n).fill(0)};
        const base0=gp;const share=1-base0;
        for(let i=0;i<n;i++){if(job.done[i])continue;if(cancelReq)throw new Error('cancel');
          const lab='소리 변환 중 ('+(i+1)+'/'+n+')';cvShow(lab,null);mediaTitle(lab);
          const onL=({message})=>{const m=/time=(\d+):(\d+):([\d.]+)/.exec(message);if(!m)return;const s=+m[1]*3600+ +m[2]*60+ +m[3];
            const fin=job.done.filter(Boolean).length,p=(fin+Math.min(1,s/LEN))/n;gp=base0+share*p;gAt=Date.now();const pct=Math.round(gp*100);cvShow('소리 변환 중… '+pct+'% (조각 '+(i+1)+'/'+n+')',gp*100);mediaTitle('소리 변환 '+pct+'%')};
          ff.on('log',onL);
          const rc=await ff.exec(['-hide_banner','-ss',String(i*LEN),'-t',String(LEN),'-i',inp,'-map','0:a:0','-vn','-sn','-dn','-ac','2','-ar','48000','-af','apad,atrim=end_sample='+(LEN*48000),'-c:a','aac','-b:a','128k','-f','adts','/c.aac']);

          await idbPut(key+'|a'+i,new Blob([data.buffer],{type:'audio/aac'}));job.done[i]=true;job.fr[i]=fr;await idbPut(key+'|aj',job)}

        if(rc!==0)throw new Error('소리 합치기 실패');

    try{await ff.unmount('/in')}catch(e){}
    if(!done.length)throw new Error(notes.join(' · ')||'꺼낼 것이 없어요');
    const msg='완료 ('+fmt((Date.now()-t0)/1000)+' 걸림) — '+done.join(' · ');
    cvShow(msg,100,notes.join(' · '),'저장됨');notifyDone('변환 완료',vname+' — '+done.join(' · '));

  }catch(e){const m=cancelReq?'cancel':(e&&e.message||String(e));
    if(m==='cancel'){cvShow('취소함 — 끝낸 조각은 저장돼 있어 다음에 이어서 합니다',null,'','')}
    else{cvShow('⚠ '+m,null,'','');notifyDone('변환 멈춤',m)}

$('#muteFix').onclick=()=>convert({audio:true,subs:true});$('#aConv').onclick=()=>convert({audio:true,subs:true});
$('#muteResume').onclick=()=>convert({audio:true,subs:false});
$('#muteSub').onclick=()=>convert({audio:false,subs:true});$('#sExt').onclick=()=>convert({audio:false,subs:true});
$('#cvX').onclick=()=>{if(ffBusy){cancelReq=true;if(ocrW){try{ocrW.terminate()}catch(e){}ocrW=null}try{ff&&ff.terminate()}catch(e){}}else $('#conv').hidden=true};

// ---- 그림 자막(PGS) → 글자 (Tesseract OCR, 폰 안에서) ----
function parseSup(u){const ev=[];let i=0,pal={},objs={},cur=null,pend=null;const rd16=o=>(u[o]<<8)|u[o+1];
  while(i+13<=u.length){if(u[i]!==0x50||u[i+1]!==0x47)break;const pts=((u[i+2]<<24>>>0)+(u[i+3]<<16)+(u[i+4]<<8)+u[i+5])/90000,t=u[i+10],sz=rd16(i+11),o=i+13;i=o+sz;
    if(t===0x16){const n=u[o+10],list=[];let q=o+11;for(let k=0;k<n;k++){const id=rd16(q),fl=u[q+3],x=rd16(q+4),y=rd16(q+6);list.push({id,x,y});q+=8+(fl&0x40?8:0)}
      if(cur&&cur.end==null)cur.end=pts;pend=n?{start:pts,list,palId:u[o+9]}:null}
    else if(t===0x14){const id=u[o];const p=pal[id]=pal[id]||{};for(let q=o+2;q+4<o+sz+1;q+=5){p[u[q]]={y:u[q+1],a:u[q+4]}}}
    else if(t===0x15){const id=rd16(o),seq=u[o+3];if(seq&0x80){const w=rd16(o+7),h=rd16(o+9);objs[id]={w,h,parts:[u.subarray(o+11,o+sz)]}}else if(objs[id])objs[id].parts.push(u.subarray(o+4,o+sz))}

    while(p<r.length&&y<m.h){const b=r[p++];if(b){put(b,1);continue}const b2=r[p++];if(b2===0){x=0;y++;continue}
      const f=b2&0xC0;let n=b2&0x3F;if(f&0x40)n=(n<<8)|r[p++];const col=f&0x80?r[p++]:0;put(col,n)}}

let ocrW=null,tessP=null;
function loadTess(){return tessP||(tessP=new Promise((ok,no)=>{const s=document.createElement('script');s.src='tess/tesseract.min.js';s.onload=ok;s.onerror=()=>no(new Error('OCR 엔진을 못 받음'));document.head.appendChild(s)}))}
const srtT=s=>{const ms=Math.round(s*1000),h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000),x=Math.floor(ms%60000/1000);return p2(h)+':'+p2(m)+':'+p2(x)+','+String(ms%1000).padStart(3,'0')};
const toSrt=cs=>cs.map((c,i)=>(i+1)+'\n'+srtT(c.s)+' --> '+srtT(c.e)+'\n'+c.x).join('\n\n')+'\n';
async function ocrSup(data,p,key){const ev=parseSup(data);if(!ev.length)return '';
  const lang=/^(kor|ko)$/.test(p.lang)?'kor':/^(eng|en)$/.test(p.lang)?'eng':'eng+kor';
  const ck=key+'|ocr'+p.i;let prev=await idbGet(ck);const res=prev&&prev.n===ev.length?prev.res:Array(ev.length).fill(null);
  cvShow('글자 읽기(OCR) 엔진 준비 중… ('+lang+')',null);await loadTess();
  ocrW=await Tesseract.createWorker(lang,1,{workerPath:new URL('tess/worker.min.js',location.href).href,corePath:new URL('tess/core/',location.href).href,langPath:new URL('tess/lang/',location.href).href,gzip:true,cacheMethod:'none'});
  await ocrW.setParameters({tessedit_pageseg_mode:'6'});
  const t1=Date.now();let did=0,todo=res.filter(r=>r==null).length;
  for(let k=0;k<ev.length;k++){if(res[k]!=null)continue;if(cancelReq)break;
    const {data:{text}}=await ocrW.recognize(supCanvas(ev[k]));res[k]=text.replace(/[|_~]/g,'').replace(/[ \t]+/g,' ').split('\n').map(s=>s.trim()).filter(Boolean).join('\n');did++;
    const el=(Date.now()-t1)/1000,pp=(ev.length-todo+did)/ev.length;cvShow('그림 자막 글자로 읽는 중 ('+lang+') '+(ev.length-todo+did)+'/'+ev.length,pp*100,null,'남은 약 '+fmt(el/did*(todo-did)));mediaTitle('자막 OCR '+Math.round(pp*100)+'%');
    if(did%10===0)await idbPut(ck,{n:ev.length,res})}
  await idbPut(ck,{n:ev.length,res});try{await ocrW.terminate()}catch(e){}ocrW=null;if(cancelReq)throw new Error('cancel');
  await idbDel(ck);
  return toSrt(ev.map((e,k)=>({s:e.start,e:e.end,x:res[k]})).filter(c=>c.x))}

// ---- 자막 저장(srt) ----
async function saveSubs(){if(!T.ko.length&&!T.en.length)return toast('저장할 자막이 없어요');
  const d=new Date(),y=String(d.getFullYear()).slice(2)+p2(d.getMonth()+1)+p2(d.getDate()),nm=(vname||'자막').replace(/\.[^.]+$/,'');
  const sh=cs=>cs.map(c=>({s:Math.max(0,c.s+off),e:Math.max(0,c.e+off),x:c.x}));
  const out=[];if(T.en.length)out.push([y+'_'+nm+'_영어.srt',toSrt(sh(T.en))]);if(T.ko.length)out.push([y+'_'+nm+'_한글.srt',toSrt(sh(T.ko))]);
  for(const [n,t] of out){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+t],{type:'application/x-subrip'}));a.download=n;document.body.appendChild(a);a.click();a.remove();await new Promise(r=>setTimeout(r,400))}
  toast(out.length+'개 저장 → 다운로드 폴더'+(off?' (싱크 '+off.toFixed(1)+'초 반영)':''),3000)}
$('#sSave').onclick=saveSubs;

  const a=document.createElement('a');a.href=ext;a.download=y+'_'+vname.replace(/\.[^.]+$/,'')+'_소리.m4a';document.body.appendChild(a);a.click();a.remove();toast('소리 파일 저장 → 다운로드 폴더',2500)};

// ================= 자막 생성: 영어 받아쓰기(Groq Whisper large-v3) + 한글 번역(Groq) =================
// 소리는 ffmpeg로 10분 조각(16kHz 모노 m4a)만 만들어 보냄 → 변환해 둔 소리가 있으면 그걸 씀(빠름)
let gkey=ld('sp_gkey',''),gTrOn=ld('sp_gtr',true),gLang=ld('sp_glang','en'),genRun=false,genCtl=null,isGen=false;
const TRM=['llama-3.3-70b-versatile','openai/gpt-oss-120b','qwen/qwen3-32b'];let trM=ld('sp_trm',0),ckey=ld('sp_ckey',''),eng=ld('sp_eng','groq');
const CLM=['claude-sonnet-5-5','claude-haiku-5-5'];
function toggleGen(){const g=$('#gen');g.hidden=!g.hidden;$('#bGen').classList.toggle('tog',!g.hidden);sv('sp_genopen',!g.hidden);genUI()}
$('#bGen').onclick=toggleGen;if(ld('sp_genopen',false)){$('#gen').hidden=false;$('#bGen').classList.add('tog')}

$('#gKeySv').onclick=()=>{const k=$('#gKey').value.trim();if(!/^gsk_/.test(k))return toast('gsk_ 로 시작하는 키를 붙여넣으세요',2500);gkey=k;sv('sp_gkey',k);$('#gKey').value='';genUI();toast('키 저장 (이 폰 브라우저에만)')};
$('#gKeyCh').onclick=()=>{const b=$('#gKeyCh');if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='지울까요?';setTimeout(()=>{b.classList.remove('arm');b.textContent='키 지우기'},3000);return}
  gkey='';sv('sp_gkey','');b.classList.remove('arm');b.textContent='키 지우기';genUI();toast('키 지움')};
$('#eGq').onclick=()=>{eng='groq';sv('sp_eng',eng);genUI();toast('번역: Groq (무료)')};

$('#cKeyCh').onclick=()=>{const b=$('#cKeyCh');if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='지울까요?';setTimeout(()=>{b.classList.remove('arm');b.textContent='Claude 키 지우기'},3000);return}ckey='';sv('sp_ckey','');b.classList.remove('arm');b.textContent='Claude 키 지우기';genUI();toast('Claude 키 지움')};
async function claudeAsk(p,sig){for(let tr=0;tr<4;tr++){let r;
  try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:sig,headers:{'x-api-key':ckey,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:CLM[tr>=2?1:0],max_tokens:4096,messages:[{role:'user',content:p}]})})}
  catch(e){if(e.name==='AbortError')throw e;throw {code:'net'}}
  if(r.ok){const j=await r.json();return (j.content||[]).map(c=>c.text||'').join('')}
  if(r.status===429||r.status>=500){gp(-1,'Claude 잠시 대기 후 다시…');await sleep(15000*(tr+1),sig);continue}
  const t=await r.text().catch(()=>'');if(r.status===401)throw {code:401,claude:1};if(r.status===404||(r.status===400&&/model/i.test(t))){continue}throw {code:r.status,msg:t.slice(0,200)}}
  throw {code:429}}
function genUI(){$('#gKeyRow').hidden=!!gkey;$('#gKeyCh').hidden=!gkey;$('#cKeyCh').hidden=!ckey;$('#cKeyRow').hidden=!(eng==='claude'&&!ckey);$('#eGq').classList.toggle('tog',eng==='groq');$('#eCl').classList.toggle('tog',eng==='claude');$('#gTr').classList.toggle('tog',gTrOn);
  $('#gGo').textContent=genRun?'중지':'시작';$('#gGo').classList.toggle('tog',!genRun);
  $('#gTrOnly').hidden=genRun||!(T.en.length&&!T.ko.length);
  $('#gSrc').textContent=!vk?'먼저 「영상」을 고르세요':(extBlob?'소리: 변환해 둔 소리 (빠름)':'소리: 열린 영상');
  idbGet(vk+'|gj').then(j=>{if(!genRun&&j&&j.en&&!j.fin)$('#gGo').textContent='이어서 ('+j.done.filter(Boolean).length+'/'+j.n+')'})}
function gp(p,txt){if(p>=0)$('#gPb i').style.width=Math.round(Math.max(0,Math.min(1,p))*100)+'%';$('#gPt').textContent=txt}
const sleep=(ms,sig)=>new Promise((r,j)=>{const t=setTimeout(r,ms);sig&&sig.addEventListener('abort',()=>{clearTimeout(t);j(new DOMException('','AbortError'))})});
async function groq(path,body,sig,json){
  for(let tr=0;tr<4;tr++){let r;
    try{r=await fetch('https://api.groq.com/openai/v1/'+path,{method:'POST',headers:json?{Authorization:'Bearer '+gkey,'Content-Type':'application/json'}:{Authorization:'Bearer '+gkey},body,signal:sig})}
    catch(e){if(e.name==='AbortError')throw e;throw {code:'net'}}
    if(r.ok)return r.json();
    if(r.status===429||r.status>=500){const ra=+(r.headers.get('retry-after')||0);gp(-1,'잠시 대기 후 다시 시도…');await sleep(Math.min(60,ra||15*(tr+1))*1000,sig);continue}
    const t=await r.text().catch(()=>'');throw {code:r.status,msg:t.slice(0,200)}}
  throw {code:429}}
function showTitle(){const n=(vname||'').replace(/\.[^.]+$/,'').replace(/^\d{6}_/,'').replace(/[._]+/g,' ');return n.replace(/\s*S\d+E\d+.*$/i,'').trim()||n}
const HALL=/^(thank you\.?|thanks for watching!?|you|\.+|subtitles by.*|please subscribe.*|♪+)$/i;
function splitSeg(s,e,x){x=x.replace(/\s+/g,' ').trim();if(x.length<=84)return [{s,e,x}];
  const parts=x.split(/(?<=[.?!])\s+/),g=[];let cur='';for(const p of parts){if(cur&&(cur+' '+p).length>84){g.push(cur);cur=p}else cur=cur?cur+' '+p:p}if(cur)g.push(cur);
  const tot=g.reduce((a,b)=>a+b.length,0),out=[];let t=s;for(const q of g){const d=(e-s)*q.length/tot;out.push({s:t,e:t+d,x:q});t+=d}return out}
function errMsg(e){if(e&&e.code==='net')return '인터넷 연결 확인 — Groq 서버에 닿지 못했어요';
  if(e&&e.code===401)return (e.claude?'Claude':'Groq')+' 키가 맞지 않아요 — 「키 지우기」 후 다시 붙여넣기';if(e&&e.code===413)return '조각이 너무 커요';if(e&&e.code===429)return 'Groq 사용 한도 — 잠시 뒤 「이어서」';
  return '오류: '+(e&&(e.msg||e.code||e.message)||e)}
async function genSave(job){if(!vk)return;await idbPut(vk+'|gen',JSON.stringify({en:T.en,ko:T.ko,lang:gLang,at:Date.now()}));if(job)await idbPut(vk+'|gj',job)}
window.__genLoad=async key=>{const s=await idbGet(key+'|gen');if(!s||key!==vk||T.en.length||T.ko.length)return false;
  try{const x=JSON.parse(s);if(!x.en||!x.en.length)return false;T.en=x.en;T.ko=x.ko||[];names.en='만든 자막';names.ko=T.ko.length?'만든 번역':'';isGen=true;if(T.ko.length&&mode!=='both'){mode='both';sv('sp_mode','both')}
    rebuild();showName();genUI();setTimeout(()=>toast('만든 자막 불러옴 · 영 '+T.en.length+'줄'+(T.ko.length?' · 한 '+T.ko.length+'줄':''),3000),2700);return true}catch(e){return false}};

// 번역 (35줄씩, 앞 대사 4줄 참고)
async function trBatch(i0,i1,sig){const lines=T.en.slice(i0,i1).map(c=>c.x);if(!lines.length)return true;
  const ctx=T.en.slice(Math.max(0,i0-4),i0).map(c=>c.x);
  const p='다음은 영상 「'+showTitle()+'」의 '+(gLang==='ja'?'일본어':'영어')+' 자막 '+lines.length+'줄입니다. 각 줄을 자연스러운 한국어 자막체(짧은 구어체, 인물 관계에 맞는 존댓말·반말, 고유명사는 통용 표기)로 번역하세요.\n'+
    (ctx.length?'앞 대사(참고만, 번역하지 말 것): '+JSON.stringify(ctx)+'\n':'')+'줄 수와 순서를 그대로 유지하고, 한국어 문자열 '+lines.length+'개짜리 JSON 배열만 출력하세요.\n'+JSON.stringify(lines);
  for(let tr=0;tr<TRM.length+1;tr++){
    try{let t;if(eng==='claude'&&ckey)t=await claudeAsk(p,sig);else{const j=await groq('chat/completions',JSON.stringify({model:TRM[trM%TRM.length],temperature:0.2,messages:[{role:'user',content:p}]}),sig,true);t=j.choices[0].message.content||''}
      const arr=JSON.parse(t.slice(t.indexOf('['),t.lastIndexOf(']')+1));
      if(Array.isArray(arr)){const ko=T.ko.slice();for(let k=0;k<lines.length;k++){const x=arr[k]!=null?String(arr[k]).trim():'';if(x){const c=T.en[i0+k];ko.push({s:c.s,e:c.e,x})}}
        T.ko=ko.sort((a,b)=>a.s-b.s);names.ko='만든 번역';return true}}
    catch(e){if(e&&e.name==='AbortError')throw e;if(e&&(e.code===400||e.code===404)&&/model/i.test(e.msg||'')){trM++;sv('sp_trm',trM)}else if(e&&e.code===401)throw e}}
  return false}
async function translateFrom(i0,sig,p0,p1){const N=T.en.length,BS=35;
  for(let i=i0;i<N;i+=BS){if(sig.aborted)return;gp(p0+(p1-p0)*(i-i0)/Math.max(1,N-i0),'번역 '+Math.min(N,i+BS)+'/'+N+'줄');await trBatch(i,Math.min(N,i+BS),sig);rebuild()}}

// 받아쓰기 조각 소리 만들기
async function chunkAudio(i,LEN,useExt,onP){const inp=await ffReady();let src=inp;
  if(useExt){try{await ff.createDir('/ga')}catch(e){}try{await ff.unmount('/ga')}catch(e){}await ff.mount('WORKERFS',{blobs:[{name:'a.m4a',data:extBlob}]},'/ga');src='/ga/a.m4a'}
  const onL=({message})=>{const m=/time=(\d+):(\d+):([\d.]+)/.exec(message);if(m)onP(Math.min(1,(+m[1]*3600+ +m[2]*60+ +m[3])/LEN))};
  ff.on('log',onL);const rc=await ff.exec(['-hide_banner','-ss',String(i*LEN),'-t',String(LEN),'-i',src,'-map','0:a:0','-vn','-sn','-dn','-ac','1','-ar','16000','-c:a','aac','-b:a','40k','-f','mp4','/g.m4a']);ff.off('log',onL);
  if(rc!==0)throw {code:'ff',msg:'소리 조각 만들기 실패 ('+(i+1)+')'};
  const d=await ff.readFile('/g.m4a');try{await ff.deleteFile('/g.m4a')}catch(e){}return new Blob([d.buffer],{type:'audio/mp4'})}

async function startGen(){if(!vk||!curFile)return toast('먼저 「영상」을 고르세요',2500);
  if(!gkey){$('#gen').hidden=false;$('#gKey').focus();return toast('Groq 키를 먼저 붙여넣고 저장하세요',2500)}
  if(ffBusy)return toast('소리 변환이 끝난 뒤에 해 주세요',2500);
  let job=await idbGet(vk+'|gj');if(job&&job.fin)job=null;
  if(!job&&T.en.length&&!isGen&&!armOK())return;
  genRun=true;ffBusy=true;cancelReq=false;genCtl=new AbortController();const sig=genCtl.signal,key=vk,t0=Date.now();genUI();askNotify();keepAlive(true,'자막 만드는 중');
  let gpv=0,gAt=Date.now();timerStart(t0,()=>gpv,()=>gAt);
  try{
    cvShow('받아쓰기 준비 중…',0,'','');
    const dur=v.duration||0,LEN=600,n=Math.max(1,Math.ceil(dur/LEN)),useExt=!!extBlob,shift=k=>useExt&&amap?k*amap.prime:0;
    if(!job||job.n!==n){job={n,done:Array(n).fill(false),en:[],prompt:showTitle()+'.'}}
    T.en=job.en.slice();T.ko=[];isGen=true;names.en='만든 자막';names.ko='';if(mode!=='both'){mode='both';sv('sp_mode','both')}rebuild();showName();
    for(let k=0;k<n;k++){if(job.done[k])continue;if(sig.aborted||cancelReq)throw new DOMException('','AbortError');
      const lab='받아쓰기 '+(k+1)+'/'+n+'조각';const base0=(job.done.filter(Boolean).length)/n;
      const set=(p,t)=>{gpv=(base0+p/n)*(gTrOn?0.85:1);gAt=Date.now();const pct=Math.round(gpv*100);cvShow(t+' '+pct+'%',gpv*100);gp(gpv,t+' · '+pct+'%');mediaTitle('자막 '+pct+'%')};
      set(0,lab+' · 소리 자르는 중');
      const blob=await chunkAudio(k,LEN,useExt,p=>set(p*0.4,lab+' · 소리 자르는 중'));if(cancelReq)throw new DOMException('','AbortError');
      set(0.45,lab+' · 받아쓰는 중');
      const fd=new FormData();fd.append('file',blob,'part'+k+'.m4a');fd.append('model','whisper-large-v3');fd.append('response_format','verbose_json');
      fd.append('language',gLang);fd.append('temperature','0');fd.append('prompt',(job.prompt||'').slice(-400));
      const j=await groq('audio/transcriptions',fd,sig);
      const off0=k*LEN-shift(k);let prev='';const add=[];
      for(const sg of (j.segments||[])){const x=(sg.text||'').trim();if(!x||HALL.test(x))continue;if(sg.no_speech_prob>0.7&&sg.avg_logprob<-0.8)continue;if(x===prev)continue;prev=x;
        for(const c of splitSeg(off0+sg.start,off0+Math.min(sg.end,LEN),x))add.push(c)}
      job.en=job.en.concat(add).sort((a,b)=>a.s-b.s);job.done[k]=true;job.prompt=showTitle()+'. '+(j.text||'').slice(-300);
      if(key===vk){T.en=job.en.slice();rebuild();genUI()}await genSave(job);set(1,lab+' 끝')}
    try{await ff.unmount('/ga')}catch(e){}try{await ff.unmount('/in')}catch(e){}
    if(gTrOn&&key===vk){T.ko=[];cvShow('한글 번역 중…',85);await translateFrom(0,sig,0.85,1);if(sig.aborted)throw new DOMException('','AbortError')}
    job.fin=true;await genSave(job);upsertRecent({subs:['만든 자막']});
    const sec=Math.round((Date.now()-t0)/1000),msg='자막 완성 · 영 '+T.en.length+'줄'+(T.ko.length?' · 한 '+T.ko.length+'줄':'')+' · '+fmt(sec)+' 걸림';
    gp(1,msg);cvShow(msg,100,'같은 영상을 다시 열면 자동으로 불러와요','저장됨');notifyDone('자막 완성',vname+' — 영 '+T.en.length+'줄');setTimeout(()=>$('#conv').hidden=true,6000)}
  catch(e){if(e&&e.name==='AbortError'){gp(0,'중지함 — 끝낸 조각은 저장돼 「이어서」로 계속');cvShow('중지함 — 끝낸 조각은 저장돼 있어요',null,'','')}
    else{const m=errMsg(e);gp(0,m);cvShow('⚠ '+m,null,'','');notifyDone('자막 만들기 멈춤',m)}
    try{ff&&ff.terminate()}catch(_){}ff=null;setTimeout(()=>$('#conv').hidden=true,6000)}
  finally{clearInterval(cvTimer);genRun=false;ffBusy=false;genCtl=null;keepAlive(false);genUI();rebuild()}}
let armT=0;function armOK(){if(Date.now()-armT<3000){armT=0;return true}armT=Date.now();toast('지금 자막을 새로 만든 자막으로 바꿉니다 — 「시작」을 한 번 더',3000);return false}
function stopGen(){cancelReq=true;if(genCtl)genCtl.abort();try{ff&&ff.terminate()}catch(e){}}
$('#gGo').onclick=()=>genRun?stopGen():startGen();
$('#gTrOnly').onclick=async()=>{if(eng==='claude'?!ckey:!gkey)return toast((eng==='claude'?'Claude':'Groq')+' 키가 필요해요',2500);genRun=true;genCtl=new AbortController();genUI();T.ko=[];
  try{await translateFrom(0,genCtl.signal,0,1);await genSave();gp(1,'번역 완료 · '+T.ko.length+'줄');if(mode!=='both')setMode('both')}
  catch(e){gp(0,e&&e.name==='AbortError'?'중지함':errMsg(e))}finally{genRun=false;genCtl=null;genUI();rebuild()}};
{const x0=$('#cvX').onclick;$('#cvX').onclick=()=>{if(genRun)stopGen();else x0()}}
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.isContentEditable)return;if(e.key==='g'||e.key==='G')toggleGen()});

async function keepStore(){try{if(navigator.storage&&navigator.storage.persist&&!(await navigator.storage.persisted()))await navigator.storage.persist()}catch(e){}}
async function storeInfo(){try{const p=navigator.storage&&navigator.storage.persisted?await navigator.storage.persisted():false;const e=navigator.storage&&navigator.storage.estimate?await navigator.storage.estimate():{};
  $('#stInfo').textContent='보관 '+Math.round((e.usage||0)/1048576)+'MB · '+(p?'고정 ✓ (지워지지 않음)':'고정 ✗ (폰이 지울 수 있음)')}catch(err){$('#stInfo').textContent=''}}

$('#aPick').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(!vk)return toast('먼저 「영상」을 고르세요');
